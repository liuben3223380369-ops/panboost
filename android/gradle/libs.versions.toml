# PanBoost Android 原生重构（v4.0 计划，第 1 周骨架）
# 版本选型原则：保守稳定组合，KSP 与 Kotlin 严格配对
[versions]
agp = "8.9.1"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.32"
hilt = "2.56.2"
composeBom = "2025.05.01"
activityCompose = "1.10.1"
coreKtx = "1.16.0"
lifecycle = "2.9.0"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
work = "2.10.0"
androidxHilt = "1.2.0"
coroutines = "1.10.2"
navigation = "2.8.9"
retrofit = "2.11.0"
okhttp = "4.12.0"

[libraries]
# 供 build-logic 的 convention plugin classpath
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

# Compose（BOM 统一管版本）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Hilt（@AndroidEntryPoint/@HiltAndroidApp 需要 hilt gradle plugin
# 做字节码变换给注解补 value——CI 实锤纯 KSP 路径不适用）
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

# Kotlin 协程（domain Flow / Worker）
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# 网络层（第 4 周：夸克 Web API——网页版前端自己用的公开接口 + 用户登录 Cookie）
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Navigation（第 3 周起：单 Activity NavHost）
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# WorkManager（第 2 周：下载 Worker 持久化队列）
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# androidx.hilt（第 2 周：@HiltWorker 注入 Worker）
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }

# 测试
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# 本项目 convention 插件（build-logic 内部声明，无版本号）
panboost-android-application = { id = "panboost.android.application" }
panboost-android-library = { id = "panboost.android.library" }
panboost-android-application-compose = { id = "panboost.android.application.compose" }
panboost-android-library-compose = { id = "panboost.android.library.compose" }
panboost-hilt = { id = "panboost.hilt" }
