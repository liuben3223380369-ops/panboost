name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Lint (v5.4.0：静态检查基线——NIA 对照查缺)
        run: cd android && ./gradlew lintRelease || true

      - name: Unit tests (v5.4.1：硬门禁——29 用例全绿才过)
        run: |
          cd android && ./gradlew testReleaseUnitTest || {
            echo "::group::测试失败详情"
            find . -path "*/test-results/*/TEST-*.xml" -exec grep -l "failure" {} \; | while read f; do
              echo "=== $f"
              grep -A4 "<failure" "$f" | head -12
            done
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-6.1.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v6.1.0——App 封面 + 网盘域核对版。' '①App 封面：自适应图标（三箭头聚合下载标志——纯 VectorDrawable 零二进制，品牌蓝背景）+ 冷启动封面（深蓝底+居中 logo，冷启动不再白屏闪断）。' '②网盘域核对（OpenList 89 驱动逐一对照）：UC 补 pc-api.uc.cn（OpenList quark_uc UC 版 API 域）、天翼补 api.cloud.189.cn（189pc 网页版 API 域）、蓝奏补 woozooo.com（OpenList 实锤主域——网页版文件操作常用域）——Cookie 采集域覆盖更完整。' '既有：反风控（固定UA+并发8+10MB块）/Cookie 全链路/29 用例门禁。' > "$NOTES_FILE"
          TAG="android-v6.1.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v6.1.0（App封面+网盘域核对）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
