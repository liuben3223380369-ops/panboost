name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-5.1.1-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v5.1.1——网盘列表空白三重根治。' '用户实锤"账号页已登录、网盘 Tab 却空白"的三条根因链一次修复：①生命周期刷新——网屏 ViewModel 只在首次创建时加载一次，先开网盘 Tab（未登录失败）→登录→回来同一实例永不再拉。现每次 Tab 回前台（ON_RESUME）自动重拉列表（加载中防抖）。②空态/错误态持久 UI——加载失败原来只闪一次提示即消失，现在网盘 Tab 常驻错误卡片（错误详情+重新加载按钮+一键直达账号页登录）。③Cookie 采集域修正——登录屏原来只查 catalog 域（quark.cn），而 __puus/__pus 实际种在登录页域（pan.quark.cn）——采到的 Cookie 不全带去 API 即失败。现多域合并采集（登录页 host 优先覆盖），登录态完整。' '既有：Set-Cookie 保活/1024 线程/防风控/三网盘分享/历史/日志。' > "$NOTES_FILE"
          TAG="android-v5.1.1"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v5.1.1（网盘列表空白根治）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
