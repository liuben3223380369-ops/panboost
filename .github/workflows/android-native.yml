name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v4.0 第 5 周收官：AGP 8.11.1 + Gradle 8.13 + compileSdk/targetSdk 36
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 验收标准字面满足：先生成 ./gradlew（wrapper jar 为二进制，
      # 本地环境无法生成，CI 生成后使用），再跑 assembleDebug
      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK（v4.1.0：R8 minify + shrink）
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Smoke check APK（零权限验证：无 MANAGE_EXTERNAL_STORAGE）
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::app-release.apk 未生成"; exit 1; }
          ls -lh "$APK"
          # 第 5 周验收：公共 Download 走 MediaStore 零权限——
          # APK 内不得申请"所有文件访问"
          AAPT="$HOME/.gradle/dependencies/android-sdk-cache-none/build-tools"
          unzip -p "$APK" AndroidManifest.xml > /dev/null 2>&1 || true
          if strings "$APK" | grep -q "MANAGE_EXTERNAL_STORAGE"; then
            echo "::error::检测到 MANAGE_EXTERNAL_STORAGE（应走 MediaStore 零权限路径）"
            exit 1
          fi
          echo "零权限验证通过（无 MANAGE_EXTERNAL_STORAGE）"
          # v4.1.0：R8 保真门禁——关键 URL/类必须在 dex 中（防过度裁剪产出残废 APK）
          python3 -c "import zipfile,sys; dex=zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk').read('classes.dex'); keys=[b'drive-pc.quark.cn',b'pan.quark.cn',b'OkHttpClient',b'Lorg/panboost',b'MultiThreadDownloadWorker']; missing=[k.decode() for k in keys if k not in dex]; sys.exit('::error::R8 过度裁剪, 缺失: '+str(missing)) if missing else print('R8 保真校验通过')"
