name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Lint (v5.4.0：静态检查基线——NIA 对照查缺)
        run: cd android && ./gradlew lintRelease || true

      - name: Unit tests (v5.4.0：测试基线)
        run: cd android && ./gradlew testReleaseUnitTest || true

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-5.4.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v5.4.0——架构查缺补漏版（联网对照 Now in Android 最新实践）。' '研究成果与落地：①新增 :core:ui 共享层——fmtSize 等格式化函数此前在 home/history/share 三屏各复制一份（NIA core/ui 单一定义点模式），现统一收编并新增 fmtSpeed/状态语义色；②CI 加 lintRelease + testReleaseUnitTest 步骤（对照 NIA：静态检查与单元测试基线我们从未建立——首版先跑通不阻塞发布，后续逐步收紧为门禁）；③AndroidLibraryConventionPlugin 收编 NIA 细节：testOptions.targetSdk=36 对齐 + minSdk 26 保持（NIA 是 24，我们 26 因 WorkManager/MediaStore）。' '既有：直链 Cookie/三形态解析/CDN 双重探测/512~1024 线程/防风控/三网盘分享/历史/日志。' > "$NOTES_FILE"
          TAG="android-v5.4.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v5.4.0（架构查缺补漏）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
