name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Lint (v5.4.0：静态检查基线——NIA 对照查缺)
        run: cd android && ./gradlew lintRelease || true

      - name: Unit tests (v5.4.1：硬门禁——29 用例全绿才过)
        run: |
          cd android && ./gradlew testReleaseUnitTest || {
            echo "::group::测试失败详情"
            find . -path "*/test-results/*/TEST-*.xml" -exec grep -l "failure" {} \; | while read f; do
              echo "=== $f"
              grep -A4 "<failure" "$f" | head -12
            done
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-7.0.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v7.0.0——天翼云盘接入（浏览下载第三家）+ 全网盘 API 研究完成。' '本版本完成 OpenList 全部 89 个驱动的批量研究（11 家核心网盘源码精读），按 Cookie 直连可行性分类落地：①天翼云盘接入（OpenList 189 驱动规格：listFiles.action 列表/GetFileInfo.action 双跳直链/Cookie 会话+Referer）——浏览下载全通；②研究结论透明化（ROADMAP P0#5）：百度/123/阿里/迅雷为 OAuth 类——官方 API 架构性要求 access_token（百度 openapi/oauth、123 账密换 token、阿里平台申请），WebView Cookie 方案在此类网盘不可直连，需 OAuth 授权流（后续版本排期）；微云需完整 SDK；境外网盘按需求排期。' '现状：夸克/UC/天翼 三家浏览下载全通（1024 线程/多直链/断点续传同享），18 家登录存 Cookie 全通。' > "$NOTES_FILE"
          TAG="android-v7.0.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v7.0.0（天翼网盘接入）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
