name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Smoke check APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::app-release.apk 未生成"; exit 1; }
          ls -lh "$APK"
          if strings "$APK" | grep -q "MANAGE_EXTERNAL_STORAGE"; then
            echo "::error::检测到 MANAGE_EXTERNAL_STORAGE（应走 MediaStore 零权限路径）"
            exit 1
          fi
          echo "零权限验证通过（无 MANAGE_EXTERNAL_STORAGE）"
          python3 -c "import zipfile,sys; dex=zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk').read('classes.dex'); keys=[b'drive-pc.quark.cn',b'pan.quark.cn',b'OkHttpClient',b'Lorg/panboost',b'MultiThreadDownloadWorker']; missing=[k.decode() for k in keys if k not in dex]; sys.exit('::error::R8 过度裁剪, 缺失: '+str(missing)) if missing else print('R8 保真校验通过')"

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-4.3.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v4.3.0——多网盘账号管理版（P0 再下一城）。' 'v3.2.8 账簿原生回归（ROADMAP P0#4/#6 完成）：①18 网盘清单迁移（PanCatalog 数据驱动：夸克/UC/百度/阿里/天翼/移动/迅雷/123/蓝奏/坚果云/Google Drive/Dropbox/OneDrive/MEGA/pCloud/Box/Yandex）——账号页宫格、已登录徽标（特征 Cookie 键验证）/未验证徽标（登录态存 localStorage 的网盘保存 Cookie 供下载尝试）、删除账号。②通用登录页（路由参数选网盘，WebView 加载对应官方登录页自动检测特征 Cookie——新增网盘零代码）。③手动粘贴 Cookie（WebView 登录失败的兜底：浏览器登录后复制 Cookie 粘贴保存，v3.2.8 同款语义）。④底部四 Tab 导航（分享/网盘/下载/账号）。' '既有能力：分享链接勾选批量下载（8 线程分块+断点续传）、我的网盘浏览下载、进度/取消/重试、崩溃捕获。' '后续回补（ROADMAP）：UC/百度等逐家浏览下载接入、下载历史、日志屏。' '权限：网络+前台服务+通知，零存储权限。' '异常反馈请附 crash-*.txt。' > "$NOTES_FILE"
          TAG="android-v4.3.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v4.3.0（多网盘账号管理）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
