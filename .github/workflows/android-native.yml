name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-4.3.1-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v4.3.1——启动闪退根治版（根因终于实锤）。' 'v4.0~v4.3 全系"装上即闪"的根因：App 模块 namespace（org.panboost.app）与源码包名（org.panboost）不一致，而 Manifest 用相对类名 .MainActivity——系统解析成 org.panboost.app.MainActivity，这个类从第 1 周起就不存在，启动即 ClassNotFoundError。CI 只编译不启动所以四轮绿灯全没拦住，dex 字符串保真门禁查的是子串也放行了。' '本版双重修复：①Manifest 改全限定类名（org.panboost.MainActivity / org.panboost.PanBoostApplication）；②新增 scripts/verify_apk.py 四合一发布门禁——解 binary Manifest 字符串池，把每个组件类名（含相对名按包名解析）在 dex 中逐一校验存在，另含 R8 关键标记保真、权限白名单（拒绝任何存储权限）、结构完整性——"装上即闪"的残废包从此在 CI 层被拦截，本地也可直接运行该校验。' '功能面（v4.3.0 继承）：18 网盘账号管理（登录/徽标/删除/手动粘贴 Cookie）、分享链接勾选批量下载、多线程分块+断点续传+前台服务、崩溃捕获。' '若仍闪退请发 /Android/data/org.panboost.app/files/crashes/crash-*.txt。' > "$NOTES_FILE"
          TAG="android-v4.3.1"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v4.3.1（启动闪退根治）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
