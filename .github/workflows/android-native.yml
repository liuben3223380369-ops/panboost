name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Lint (v5.4.0：静态检查基线——NIA 对照查缺)
        run: cd android && ./gradlew lintRelease || true

      - name: Unit tests (v5.4.1：硬门禁——29 用例全绿才过)
        run: |
          cd android && ./gradlew testReleaseUnitTest || {
            echo "::group::测试失败详情"
            find . -path "*/test-results/*/TEST-*.xml" -exec grep -l "failure" {} \; | while read f; do
              echo "=== $f"
              grep -A4 "<failure" "$f" | head -12
            done
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-6.0.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v6.0.0——反风控研究重制（双权威项目对照）。' '联网精读两大权威源码后的共识落地：quark-auto-save(3072★) + OpenList(25217★) quark_uc 驱动。核心发现颠覆两个直觉：①UA 轮换是反模式——真客户端 UA 恒定不变，轮换恰是机器人指纹（两大项目 UA 全部固定，OpenList 用 quark-cloud-drive/2.5.20，quark-auto-save 用 3.14.2，都跑得通）——已移除轮换池，退避重试改为纯等待+并发收缩；②并发 8 就够——OpenList 直链下载实战配置 Concurrency=3 + PartSize=10MB 即可跑满（CDN 单流限速高，高并发纯触发 412 退避、实际吞吐反而暴跌）——慢启动上限 128 砍至 8（4 起步爬升），块大小对齐 10MB。' '效果预期：无风控触发 → 无退避等待 → 持续满速；比"高并发+退避"实际吞吐更高。' '既有：Cookie 全链路/实时罐/29 用例门禁。' > "$NOTES_FILE"
          TAG="android-v6.0.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v6.0.0（反风控研究重制）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
