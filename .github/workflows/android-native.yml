name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-5.0.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v5.0.0——v3.2.8 功能面补齐版（大版本）。' '上一版根治了启动闪退（v4.0~v4.3 的 namespace/相对类名失配雷）。本版把 v3.2.8 的完整功能面一次性补齐：①分享链接三网盘——夸克 + 123云盘（免登录 API）+ 蓝奏云（HTML 解析流）自动识别分发；②下载历史屏——永久记录 200 条（名称/大小/状态/速度/时间）、记录开关、清空、失败重跑；③日志屏——实时环形缓冲 500 条 + app-日期.log 按天轮转保留 7 天（文件管理器可取回反馈）；④下载屏新增"粘贴直链开始下载"（v3.2.8 高级下载）+ 实时速率显示（MB/s）；⑤底部五 Tab（分享/网盘/下载/历史/账号）对齐 v3.2.8 五屏，日志从账号页进入。' '既有：18 网盘账号管理、多线程分块+断点续传+前台服务、崩溃捕获、启动链门禁。' '与 v3.2.8 的剩余差距见 ROADMAP（多网盘浏览下载逐家接入、auto 线程数等）。' '权限：网络+前台服务+通知，零存储权限。' > "$NOTES_FILE"
          TAG="android-v5.0.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v5.0.0（v3.2.8 功能面补齐）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
