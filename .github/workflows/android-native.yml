name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Lint (v5.4.0：静态检查基线——NIA 对照查缺)
        run: cd android && ./gradlew lintRelease || true

      - name: Unit tests (v5.4.1：硬门禁——29 用例全绿才过)
        run: |
          cd android && ./gradlew testReleaseUnitTest || {
            echo "::group::测试失败详情"
            find . -path "*/test-results/*/TEST-*.xml" -exec grep -l "failure" {} \; | while read f; do
              echo "=== $f"
              grep -A4 "<failure" "$f" | head -12
            done
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-6.6.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v6.6.0——UC 网盘接入（多网盘浏览第二家）。' 'UC 与夸克同源 clouddrive API（OpenList quark_uc 一个驱动管两家的实证）：仅 baseUrl（pc-api.uc.cn）/UA（uc-cloud-drive 客户端）/pr 参数（UCBrowser）三处不同，接口路径与响应形态完全一致。本版：UcApi + UcDriveRepository（解析经 CookieKit 共享）+ 拦截器 UC 头分支 + 网盘选择条选 UC 即可浏览下载（多直链/1024 线程/断点续传全能力同享）。' '现状说明（透明）：18 家网盘中夸克+UC 已通浏览下载，其余 16 家登录存 Cookie 就绪、浏览 API 因每家形态完全不同需逐家研究接入（百度→天翼→123→阿里，OpenList 对应驱动为规格源）——进度见 ROADMAP P0#5。' '既有：1024 线程全开/多直链/全网盘 Cookie 泛化/29 用例门禁。' > "$NOTES_FILE"
          TAG="android-v6.6.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v6.6.0（UC网盘接入）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
