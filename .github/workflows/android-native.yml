name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-5.2.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v5.2.0——网络日志 + 网盘选择条 + 假成功诊断。' '三项修复：①网络层全链路日志——拦截器记录每个 API 请求（路径/状态码/耗时）与 Cookie 保活动作，仓库层记录异常响应原文（日志屏此前"不记录"的根因是网络层零日志——现在账号页右上"日志"可看全部请求流水，反馈问题时直接附 logs/app-日期.log）；②网盘选择条——网盘 Tab 顶部显示已登录网盘切换条（v3.2.8 首页宫格"选网盘"语义回归），切网盘重置路径加载，非夸克网盘显示接入预告（Cookie 已存好）；③假成功诊断——夸克对失效 Cookie 会返回 code:0 但无数据的"假成功"（真机实锤的"链解析失败{json}"即此），现在空列表/空直链都会记完整响应进日志并提示"登录态已失效，请到账号页删除后重新登录"。' '既有：三网盘分享/18 网盘账号/512~1024 线程/防风控/历史/崩溃捕获。' > "$NOTES_FILE"
          TAG="android-v5.2.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v5.2.0（网络日志+网盘选择条）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
