name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Lint (v5.4.0：静态检查基线——NIA 对照查缺)
        run: cd android && ./gradlew lintRelease || true

      - name: Unit tests (v5.4.1：硬门禁——29 用例全绿才过)
        run: |
          cd android && ./gradlew testReleaseUnitTest || {
            echo "::group::测试失败详情"
            find . -path "*/test-results/*/TEST-*.xml" -exec grep -l "failure" {} \; | while read f; do
              echo "=== $f"
              grep -A4 "<failure" "$f" | head -12
            done
            echo "::endgroup::"
            exit 1
          }

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-7.2.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v7.2.0——百度网盘接入（Cookie 直连第五家全通）。' '突破性研究：OpenList baidu_netdisk 走 OAuth，但被忽略的 baidu_youth 驱动实证了网页版 youth API 的 Cookie 直连路线——列表 /youth/api/list（dir/page/num + app_id=250528 web=1）；会话参数 /api/gettemplatevariable 提取 bdstoken/uk/sk；直链 /youth/api/locatedownload 本地签名（rand=SHA1(uk+sk+time+0)、sign=MD5(md5_uk_fid_time)）——纯 Cookie 会话无需 OAuth token。BaiduDriveRepository 全规格落地（会话缓存+分页列表+签名直链）。' '至此 Cookie 直连五家全通：夸克/UC/天翼/蓝奏/百度——全部享有 1024 线程/多直链/断点续传。剩余 OAuth 类（123/阿里/迅雷——官方开放平台 token 架构性必需）。' > "$NOTES_FILE"
          TAG="android-v7.2.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v7.2.0（百度接入·Cookie五家全通）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
