name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Smoke check APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::app-release.apk 未生成"; exit 1; }
          ls -lh "$APK"
          if strings "$APK" | grep -q "MANAGE_EXTERNAL_STORAGE"; then
            echo "::error::检测到 MANAGE_EXTERNAL_STORAGE（应走 MediaStore 零权限路径）"
            exit 1
          fi
          echo "零权限验证通过（无 MANAGE_EXTERNAL_STORAGE）"
          python3 -c "import zipfile,sys; dex=zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk').read('classes.dex'); keys=[b'drive-pc.quark.cn',b'pan.quark.cn',b'OkHttpClient',b'Lorg/panboost',b'MultiThreadDownloadWorker']; missing=[k.decode() for k in keys if k not in dex]; sys.exit('::error::R8 过度裁剪, 缺失: '+str(missing)) if missing else print('R8 保真校验通过')"

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-4.2.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v4.2.0——分享链接下载版（P0 核心体验回补）。' 'YunX 式核心链路原生回归（ROADMAP P0 前两项完成）：①分享链接下载——粘贴夸克分享链接（提取码可写在链接里或单独填）→ 解析出文件列表 → 勾选（单选/全选）→ 批量加速下载（8 线程 Range 分块 + 断点续传 + 前台服务通知）；②剪贴板识别——复制分享链接回到 App 自动填入（不覆盖已输入内容）。' '界面升级：底部三 Tab 导航（分享/网盘/下载，M3 NavigationBar）。' '既有能力保留：WebView 登录、我的网盘浏览下载、下载进度/取消/重试/防重复排队、全局崩溃捕获（crash-*.txt）。' '功能差距审计与后续回补（账号管理/多网盘/下载历史/日志屏等 14 项）见仓库 ROADMAP.md。' '权限：网络 + 前台服务 + 通知，零存储权限。' '异常反馈请附：/Android/data/org.panboost.app/files/crashes/crash-*.txt + 操作步骤 + 系统版本。' > "$NOTES_FILE"
          TAG="android-v4.2.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v4.2.0（分享链接下载）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
