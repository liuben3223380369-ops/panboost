name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 原生重构（v4.0 计划）：Gradle 8.13 + AGP 8.9.1 + Kotlin 2.1.20
      # setup-gradle 自带依赖缓存（首跑下载依赖，后续命中缓存）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 验收标准字面满足：先生成 ./gradlew（wrapper jar 为二进制，
      # 本地环境无法生成，CI 生成后使用），再跑 assembleDebug
      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Smoke check APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::app-debug.apk 未生成"; exit 1; }
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
