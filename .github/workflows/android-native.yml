name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-native.yml'
      - 'ROADMAP.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.13

      - name: Assemble release APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Verify APK（启动链/R8 保真/零权限/结构 四合一门禁）
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" panboost-5.1.0-android.apk; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-native-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'PanBoost v5.1.0——401 根治 + 1024 线程 + 防风控版。' '三项核心修复：①网盘浏览 401 根治——根因是漏掉了 v3.2.8 的 Cookie 保活机制（夸克 __puus 约 3 小时过期），现每次 API 响应的 Set-Cookie 自动合并回存储持久化（登录态持续保活）；401/403 时明确提示"登录已过期，请到账号页重新登录"。②线程数对齐 v3.2.8——下载屏线程选择器（auto/8/16/64/128/256/512/1024，默认 512）：auto 为实测调优（>64MB 时单连接 vs 16 并发吞吐比）；引擎块模型与旧版同构（threads×8 块、块大小 512KB~64MB 自适应）；OkHttp 并发上限调至 1024。③防风控（PersonaKit 原生）——浏览器风格请求头补全（Accept/Accept-Language + Chrome Sec-Fetch 组）、Accept-Encoding 固定 identity（Range 下载防字节错位）、UA 池轮换（403 时自动换 UA 重试）、块间随机抖动（避免完美等间隔请求特征）。' '既有：三网盘分享下载/18 网盘账号/历史/日志/前台服务/崩溃捕获。' '权限：网络+前台服务+通知，零存储权限。' > "$NOTES_FILE"
          TAG="android-v5.1.0"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v5.1.0（401根治+1024线程+防风控）" --latest --notes-file "$NOTES_FILE"
          fi
          # 删除已知的 v4.1.0 残废资产（防误装闪退）
          gh release delete-asset android-v4.1.0 panboost-4.1.0-android.apk -y -R "$GITHUB_REPOSITORY" --repo "$GITHUB_REPOSITORY" || true
