name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Install native build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libtool libtool-bin libltdl-dev autoconf automake pkg-config xvfb

      - name: KV sanity check (real Kivy, blocks startup-crash APKs)
        run: |
          pip install kivy
          cp panboost.py mobile/panboost.py
          xvfb-run -a python3 dev/check_kv.py

      - name: Cache buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}

      - name: Prepare Android SDK (Aidl fix)
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-33" > /dev/null
          mkdir -p "$SDK/tools"
          cp -a "$SDK/cmdline-tools/latest/." "$SDK/tools/"

      - name: Copy engine into mobile
        run: cp panboost.py mobile/panboost.py

      - name: Build debug APK
        run: cd mobile && buildozer -v android debug

      - name: Rename APK
        run: |
          cd mobile/bin
          for f in *.apk; do mv "$f" panboost-1.8.4-android.apk; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-apk
          path: mobile/bin/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'GitHub Actions 云端自动构建的调试签名 APK（v1.8.4 双根因修复版）。' '真机反馈 v1.8.3 点击网盘卡片后只弹"蓝灰黑三色小弹窗"、网页什么都没有、点击任何位置闪退——经 pyjnius 官方文档与 AOSP 框架源码定位双根因，本次修复：' '①"三色弹窗无内容"——Dialog 用默认浮动主题时，Android 框架（PhoneWindow）会强制把窗口尺寸压成"包住内容"模式，网页区域高度被压成 0，只剩两个按钮和深色背景。修复：对话框显示后显式设置全屏尺寸，网页区域恢复正常，v1.8.2 已验证的登录页（含百度 passport）重新正常显示。' '②"点击就闪退"——顶部两个按钮的点击回调对象此前未持有 Python 强引用（pyjnius 官方文档明确：Java 代理只存指针不持引用，Python 引用计数归零立即回收，此后 Java 侧一点按钮就触发原生崩溃）。修复：全部回调对象强引用保存，按钮点击不再闪退。' '③两项加固——WebView 渲染进程崩溃时自动关闭登录层（不处理时系统会杀掉整个 App）；登录回调统一调度回主线程操作界面，消除跨线程崩溃隐患。' 'v1.8.3 的手势返回（全屏 Dialog 系统级处理）、302 市场页拦截（onPageStarted 守卫）、导航日志（nav-*.log）等此前修复全部保留。' 'v1.8.0 功能全量包含：分享链接直接下载（蓝奏云/123云盘免登录，夸克网盘需先登录），多文件分享自动批量下载、支持提取码（链接后加 ?code=xxxx）。首页 18 家国内外网盘入口，登录 Cookie 永久保存、下载自动携带；前台服务保活锁屏不断流。' '异常请取应用目录 crash-*.log 与 nav-*.log 反馈。命令行完整功能请用 Termux，见 README。' > "$NOTES_FILE"
          TAG="android-v1.8.4"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" mobile/bin/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" mobile/bin/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v1.8.4" --latest --notes-file "$NOTES_FILE"
          fi
