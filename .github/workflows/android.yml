name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Install native build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libtool libtool-bin libltdl-dev autoconf automake pkg-config xvfb

      - name: KV sanity check (real Kivy, blocks startup-crash APKs)
        run: |
          pip install kivy
          cp panboost.py mobile/panboost.py
          xvfb-run -a python3 dev/check_kv.py

      - name: Cache buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}

      - name: Prepare Android SDK (Aidl fix)
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-33" > /dev/null
          mkdir -p "$SDK/tools"
          cp -a "$SDK/cmdline-tools/latest/." "$SDK/tools/"

      - name: Copy engine into mobile
        run: cp panboost.py mobile/panboost.py

      - name: Build debug APK
        run: cd mobile && buildozer -v android debug

      - name: Rename APK
        run: |
          cd mobile/bin
          for f in *.apk; do mv "$f" panboost-1.9.1-android.apk; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-apk
          path: mobile/bin/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'GitHub Actions 云端自动构建的调试签名 APK（v1.9.1 登录完成闪退根治版）。' '真机 v1.9.0 反馈：登录保存 Cookie 后 App 直接闪退。' '根因：关闭登录层时回调对象的强引用被立即清空，Python 回收对象后，Chromium 渲染流水线中仍在飞行的导航回调（onPageStarted/Finished 等）经 Java 桥调用已回收对象，触发 native 崩溃（SIGSEGV）。此前版本用户从未真正走通登录（色块看不懂/地址错误），此关闭路径首次被真机执行即暴露。' '修复（三层防御）：①关闭登录层前先 stopLoading 并解绑 WebViewClient、返回键监听、Dialog 取消监听——切断回调源，飞行回调不再进入 Python；②Dialog dismiss + removeView 兜底保留；③全部对象（WebView/Dialog/回调）移入退休列表延迟回收（保留最近 6 批），即使个别 ROM 解绑未生效也不会闪退。' 'v1.9.0 的登录页标准布局、登录地址实锤修正（阿里 /drive、天翼 /web、移动 yun.139.com）、桌面 UA 读回验证全部保留。' '异常请取应用目录 crash-*.log 与 nav-*.log 反馈。命令行完整功能请用 Termux，见 README。' > "$NOTES_FILE"
          TAG="android-v1.9.1"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" mobile/bin/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" mobile/bin/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v1.9.1" --latest --notes-file "$NOTES_FILE"
          fi
