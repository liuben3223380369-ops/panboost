name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Install native build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libtool libtool-bin libltdl-dev autoconf automake pkg-config xvfb

      - name: KV sanity check (real Kivy, blocks startup-crash APKs)
        run: |
          pip install kivy
          cp panboost.py mobile/panboost.py
          xvfb-run -a python3 dev/check_kv.py

      - name: Cache buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}

      - name: Prepare Android SDK (Aidl fix)
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-33" > /dev/null
          mkdir -p "$SDK/tools"
          cp -a "$SDK/cmdline-tools/latest/." "$SDK/tools/"

      - name: Copy engine into mobile
        run: cp panboost.py mobile/panboost.py

      - name: Build debug APK
        run: cd mobile && buildozer -v android debug

      - name: Rename APK
        run: |
          cd mobile/bin
          for f in *.apk; do mv "$f" panboost-1.8.5-android.apk; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panboost-apk
          path: mobile/bin/*.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: release-notes.txt
        run: |
          printf '%s\n' 'GitHub Actions 云端自动构建的调试签名 APK（v1.8.5 登录误报根治版）。' '真机反馈 v1.8.4 部分网盘登录异常：点击卡片即被记为已登录（错误）、三色区域依旧无内容。''本次深入参考网盘解析开源项目（LinkSwift / netdisk-fast-download）的登录态判定实现，三项根治：' '①登录凭证校验——此前只要 Cookie 非空就记账，而登录页的游客 Cookie（如百度的 BAIDUID）也非空，导致一进登录页点完成就被误记已登录。''现在点✓完成时必须检测到该网盘的登录特征 Cookie（百度 BDUSS、夸克/UC 的 __pus+__puus、天翼 COOKIE_LOGIN_USER 等，来自开源网盘解析项目的实战特征键）才记账；''未检测到会弹出提示且登录页保持打开。阿里云盘/迅雷/123 等登录态存在网页 localStorage 而非 Cookie 的网盘，如实显示 Cookie已存·未验证，绝不冒充已登录。' '②三色区域根治——对话框改用非浮动全屏主题构造（Android 框架对浮动主题窗口强制包内容尺寸，网页区域高度被压成 0），窗口天生全屏；''网页控件先挂载后加载并按权重分配高度；网盘页跳转 App/应用市场被拦截后自动回到登录页（最多两次），仍失败则显示说明页，不再空白。' '③夸克/UC 特征键修正——__puus 一小时过期导致检测失败，改为 __pus+__puus 双特征（开源项目实战白名单）。' 'v1.8.4 的回调强引用（防点击闪退）、渲染进程崩溃防护、v1.8.3 的手势返回/市场页拦截全部保留。' '异常请取应用目录 crash-*.log 与 nav-*.log 反馈。命令行完整功能请用 Termux，见 README。' > "$NOTES_FILE"
          TAG="android-v1.8.5"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" mobile/bin/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" mobile/bin/*.apk -R "$GITHUB_REPOSITORY" --title "PanBoost Android v1.8.5" --latest --notes-file "$NOTES_FILE"
          fi
